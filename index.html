<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Timer</title><link rel="stylesheet" href="style.css"></head><body><main class="timer"><h1>Countdown Timer</h1><div id="display">05:00</div><div class="controls"><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button></div><label>Duration (minutes)<input id="minutes" type="number" min="1" max="180" value="5"></label><p id="status" aria-live="polite">Ready to start</p></main><script src="script.js"></script></body></html>
